<!-- password-reset.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
</head>
<body style="font-family: Arial, sans-serif; background: #fdded7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1); width: 400px; text-align: center;">
        <img src="logo.png" alt="Logo" style="width: 100px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto;">
        <h2 style="color: #333; margin-bottom: 10px;">Reset Your Password</h2>
        <!-- Error message container -->
        <div id="error" style="color:red;"></div>
      
        <form id="resetForm" method="POST" action="/api/v1/user/reset_password_web" style="display: flex; flex-direction: column;">
          <input type="hidden" name="token" value="{{token}}">
          <label style="margin-bottom: 10px; text-align: left; color: #555; font-weight: bold; font-size: 14px;" for="newPassword">New Password:</label>
          <input style="padding: 12px; padding-right: 40px; border: 1px solid #ccc; border-radius: 25px; font-size: 14px;" type="password" id="newPassword" name="newPassword" required><br>
      
          <label style="margin-bottom: 10px; text-align: left; color: #555; font-weight: bold; font-size: 14px;" for="confirmPassword">Confirm Password:</label>
          <input style="padding: 12px; border: 1px solid #ccc; border-radius: 25px; font-size: 14px;" type="password" id="confirmPassword" name="confirmPassword" required><br>
      
          <button style="background: #ff5722; color: white; border: none; padding: 12px; width: 100%; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold;" type="submit">Reset Password</button>
        </form>
    </div>

  <script>
    const form = document.getElementById('resetForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        document.getElementById('error').innerText = "New password and confirm password do not match.";
        return;
      }

      // const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: new URLSearchParams({
          token: form.token.value,
          newPassword,
          confirmPassword
        })
      });
      const result = await response.json();

      if (!result.flag) {
        document.getElementById('error').innerText = result.message || "An error occurred.";
      } else {
        document.getElementById('error').style.color = 'green';
        document.getElementById('error').innerText = "Password reset successful!";
        form.reset();
      }
    });
  </script>
</body>
</html>
